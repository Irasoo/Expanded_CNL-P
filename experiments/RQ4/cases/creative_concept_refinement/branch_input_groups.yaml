case_name: creative_concept_refinement

# The reduced suite keeps two stronger product-specific briefs and two weaker
# briefs. Runtime LLM scores remain nondeterministic, so group names describe
# intended control-flow pressure rather than guaranteed scores. Each group
# contains the case's single terminal input.
input_groups:
  foldbrew_high_candidate:
    repeat: 1
    timeout_seconds: 1800
    inputs:
      - |-
        Brand:
        FoldBrew

        Product:
        A premium instant coffee concentrate packaged inside an edible, water-soluble coffee cup sleeve. When the sleeve is placed in hot water, it dissolves and becomes one serving of coffee.

        Target audience:
        Urban office workers aged 22-35 who regularly buy takeaway coffee but want a faster and lower-waste option at work.

        Objective:
        Drive first-time trial of FoldBrew and make the product's unusual "dissolve the packaging to make the coffee" behavior memorable.

        Key product benefit:
        The package itself becomes the coffee, so the user does not need a coffee machine, coffee pod, or disposable coffee sachet.

        Channels:
        Instagram, TikTok, and short-form digital video.

        Budget:
        Medium.

        Constraints:
        Use ordinary product photography and short-form video production. Do not use celebrities, large public installations, or fictional environmental claims. The central idea must visibly demonstrate the package dissolving into the drink.

  suntrace_high_candidate:
    repeat: 1
    timeout_seconds: 1800
    inputs:
      - |-
        Brand:
        SunTrace

        Product:
        A facial sunscreen that is transparent when applied normally. The package includes reusable UV-sensitive stickers. When a sticker is placed on the skin before sun exposure and removed later, the protected area remains unchanged while the surrounding exposed area temporarily reveals the sticker shape.

        Target audience:
        Young adults aged 18-30 who understand that sunscreen is important but frequently forget to reapply it during outdoor activities.

        Objective:
        Make the invisible protective effect of sunscreen visually understandable and motivate users to remember sunscreen application and reapplication.

        Key product benefit:
        The sunscreen provides SPF 50 protection, while the included UV-sensitive demonstration stickers make the effect of sun exposure easier to visualize.

        Channels:
        TikTok, Instagram Reels, and university social media communities.

        Budget:
        Low to medium.

        Constraints:
        Use only the real sunscreen and included demonstration stickers. Do not claim that the temporary visual demonstration measures exact UV damage. Do not use celebrities or expensive locations. The idea must be understandable within a short video.


  freshdrop_low_candidate:
    repeat: 1
    timeout_seconds: 1800
    inputs:
      - |-
        Brand:
        FreshDrop

        Product:
        Bottled mineral water.

        Target audience:
        Adults aged 18-45.

        Objective:
        Increase general brand awareness.

        Key product benefit:
        The product provides drinking water in a portable bottle.

        Channels:
        Instagram and Facebook.

        Budget:
        Medium.

        Constraints:
        The creative idea must be generic enough that it could also be used unchanged by other bottled-water brands. Do not rely on unique brand history, packaging, product characteristics, audience insights, or proprietary benefits. Use a conventional positive lifestyle advertising approach.


  tinytea_low_candidate:
    repeat: 1
    timeout_seconds: 1800
    inputs:
      - |-
        Brand:
        TinyTea

        Product:
        A new bottled iced tea sold by a small local beverage company.

        Target audience:
        Local university students aged 18-25.

        Objective:
        Increase awareness of TinyTea during the first month after launch.

        Key product benefit:
        A lightly sweetened bottled tea that can be served cold.

        Channels:
        Instagram, TikTok, and local university communities.

        Budget:
        Very low. The total campaign production budget is below $1,000.

        Constraints:
        The central campaign concept must include a globally famous celebrity appearing in person, a live public event in five major international cities, custom interactive digital billboards in each city, a dedicated augmented-reality mobile application, professional cinematic production, and completion of all production within seven days. Every element is mandatory and may not be removed.
